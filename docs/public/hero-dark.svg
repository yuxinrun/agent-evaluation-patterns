<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="An evaluation dashboard scoring an agent trajectory">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#eaf4ef" opacity="0.05" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35d8c4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#35d8c4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1b18" />
      <stop offset="100%" stop-color="#10231e" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#35d8c4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#35d8c4" stop-opacity="0.95" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="720" height="520" fill="url(#dots)" />
  <ellipse cx="470" cy="170" rx="230" ry="190" fill="url(#glow)" />

  <!-- 主卡片：指标看板 -->
  <g filter="url(#soft)">
    <rect x="48" y="112" width="348" height="296" rx="22" fill="url(#panel)" stroke="#eaf4ef" stroke-opacity="0.14" />
  </g>
  <g fill="#eaf4ef" opacity="0.18">
    <circle cx="74" cy="140" r="4" />
    <circle cx="90" cy="140" r="4" />
    <circle cx="106" cy="140" r="4" />
  </g>
  <rect x="74" y="160" width="126" height="10" rx="5" fill="#eaf4ef" opacity="0.3" />
  <rect x="74" y="180" width="72" height="7" rx="3.5" fill="#eaf4ef" opacity="0.14" />

  <!-- KPI 小卡 -->
  <rect x="74" y="204" width="94" height="60" rx="13" fill="#35d8c4" fill-opacity="0.1" stroke="#35d8c4" stroke-opacity="0.38" />
  <text x="88" y="228" font-family="Manrope, system-ui, sans-serif" font-size="10" font-weight="700" fill="#80968f" letter-spacing="1">SUCCESS</text>
  <text x="88" y="250" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="700" fill="#eaf4ef">92.1%</text>

  <rect x="178" y="204" width="94" height="60" rx="13" fill="#10231e" stroke="#eaf4ef" stroke-opacity="0.1" />
  <text x="192" y="228" font-family="Manrope, system-ui, sans-serif" font-size="10" font-weight="700" fill="#80968f" letter-spacing="1">TURNS</text>
  <text x="192" y="250" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="700" fill="#eaf4ef">4.2</text>

  <rect x="282" y="204" width="94" height="60" rx="13" fill="#10231e" stroke="#eaf4ef" stroke-opacity="0.1" />
  <text x="296" y="228" font-family="Manrope, system-ui, sans-serif" font-size="10" font-weight="700" fill="#80968f" letter-spacing="1">P95</text>
  <text x="296" y="250" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="700" fill="#eaf4ef">9.8s</text>

  <!-- 柱状图 -->
  <line x1="74" y1="372" x2="370" y2="372" stroke="#eaf4ef" stroke-opacity="0.14" />
  <g>
    <rect x="78" y="330" width="16" height="42" rx="6" fill="url(#bar)" />
    <rect x="106" y="316" width="16" height="56" rx="6" fill="url(#bar)" />
    <rect x="134" y="338" width="16" height="34" rx="6" fill="url(#bar)" />
    <rect x="162" y="302" width="16" height="70" rx="6" fill="url(#bar)" />
    <rect x="190" y="346" width="16" height="26" rx="6" fill="#eaf4ef" opacity="0.16" />
    <rect x="218" y="322" width="16" height="50" rx="6" fill="url(#bar)" />
    <rect x="246" y="336" width="16" height="36" rx="6" fill="url(#bar)" />
    <rect x="274" y="296" width="16" height="76" rx="6" fill="url(#bar)" />
    <rect x="302" y="342" width="16" height="30" rx="6" fill="#ff7c5e" opacity="0.85" />
  </g>

  <!-- 轨迹卡 -->
  <g filter="url(#soft)">
    <rect x="424" y="88" width="248" height="186" rx="20" fill="url(#panel)" stroke="#eaf4ef" stroke-opacity="0.14" />
  </g>
  <text x="448" y="120" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="700" fill="#80968f" letter-spacing="1.6">TRACE</text>
  <g stroke="#35d8c4" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 5">
    <line x1="458" y1="146" x2="458" y2="228" />
  </g>
  <g fill="#35d8c4">
    <circle cx="458" cy="146" r="6" />
    <circle cx="458" cy="188" r="6" />
    <circle cx="458" cy="228" r="6" />
  </g>
  <g fill="#eaf4ef" opacity="0.18">
    <rect x="478" y="138" width="150" height="16" rx="8" />
    <rect x="478" y="180" width="112" height="16" rx="8" />
    <rect x="478" y="220" width="132" height="16" rx="8" />
  </g>

  <!-- PASS 徽章 -->
  <g filter="url(#soft)">
    <rect x="286" y="62" width="104" height="36" rx="18" fill="#c4e35d" fill-opacity="0.12" stroke="#c4e35d" stroke-opacity="0.45" />
  </g>
  <path d="M306 80l5 5 10-11" fill="none" stroke="#c4e35d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="330" y="86" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="700" fill="#c4e35d">PASS</text>

  <!-- 仪表盘 -->
  <g transform="translate(520 352)">
    <path d="M-62 0a62 62 0 0 1 124 0" fill="none" stroke="#eaf4ef" stroke-opacity="0.12" stroke-width="12" stroke-linecap="round" />
    <path d="M-62 0a62 62 0 0 1 92-53" fill="none" stroke="#35d8c4" stroke-width="12" stroke-linecap="round" />
    <line x1="0" y1="0" x2="24" y2="-44" stroke="#eaf4ef" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#eaf4ef" />
  </g>
  <text x="490" y="392" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="700" fill="#80968f" letter-spacing="1.4">QUALITY GATE</text>

  <!-- 浮动小卡 -->
  <g filter="url(#soft)">
    <rect x="432" y="302" width="112" height="34" rx="17" fill="url(#panel)" stroke="#eaf4ef" stroke-opacity="0.12" />
  </g>
  <circle cx="452" cy="319" r="5" fill="#ff7c5e" />
  <text x="464" y="324" font-family="Manrope, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b4c9c1">1 failing</text>

  <g filter="url(#soft)">
    <rect x="60" y="428" width="196" height="42" rx="21" fill="url(#panel)" stroke="#eaf4ef" stroke-opacity="0.12" />
  </g>
  <text x="82" y="455" font-family="Manrope, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b4c9c1">baseline diff · -0.7pt</text>
</svg>
